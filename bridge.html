<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bridge SECT · Sectora</title>
<meta name="description" content="Move SECT between Ethereum and BNB Chain with the official Sectora bridge (LayerZero).">
<meta name="theme-color" content="#f4f5f7">
<meta name="google" content="notranslate">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="preload" href="fonts/IBMPlexSans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="launch.css?v=20261120a">
<style>
  body { padding-top: 0; }
  .br { max-width: 1080px; margin: 0 auto; padding: 28px var(--pad) 72px; }
  .br-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .br-top .sl-brand { display: flex; align-items: center; gap: 10px; }
  .br-langs { display: flex; gap: 4px; }
  .br-langs button { padding: 6px 10px; border-radius: 999px; font-size: 12.5px; color: var(--ink3); }
  .br-langs button.on { background: rgba(10, 13, 18, .07); color: var(--ink); }
  .br-head { margin: 34px 0 26px; max-width: 640px; }
  .br-head h1 { font-weight: 200; font-size: clamp(34px, 5vw, 56px); letter-spacing: -0.035em; margin: 14px 0 12px; }
  .br-head p { color: var(--ink2); line-height: 1.7; }
  .br-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 18px; align-items: start; }
  .br-card { padding: clamp(18px, 2.4vw, 28px); }
  .br-route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
  .br-net { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; }
  .br-net .lbl { display: block; margin-bottom: 4px; }
  .br-net b { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .br-net small { display: block; color: var(--ink3); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .br-flip { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; background: #fff; transition: transform .35s var(--ease); }
  .br-flip:hover { transform: rotate(180deg); }
  .br-flip svg { width: 18px; height: 18px; }
  .br-amt { margin-top: 16px; }
  .br-amt .sl-input { font-size: 22px; padding-top: 16px; padding-bottom: 16px; }
  .br-bal { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--ink3); margin-top: 8px; }
  .br-bal button { color: var(--key); font-weight: 500; font-size: 13px; }
  .br-to { font-size: 13px; color: var(--ink3); margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .br-to code { font-family: var(--mono); font-size: 12px; color: var(--ink2); word-break: break-all; }
  .br-to button { color: var(--key); font-size: 13px; }
  .br-sum { margin-top: 16px; }
  .br-sum .sl-kv b small { color: var(--ink3); font-weight: 400; }
  .br-go { margin-top: 18px; }
  .br-go .sl-btn { width: 100%; justify-content: center; padding: 15px 22px; font-size: 15.5px; }
  .br-err { margin-top: 12px; }
  .br-side h3 { font-size: 17px; font-weight: 400; margin-bottom: 12px; }
  .br-how { list-style: none; display: grid; gap: 12px; }
  .br-how li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14px; color: var(--ink2); line-height: 1.6; }
  .br-how li span.n { width: 24px; height: 24px; border-radius: 50%; background: rgba(21, 105, 255, .09); color: var(--key); display: grid; place-items: center; font-size: 12px; font-weight: 500; }
  .br-tx { border-top: 1px solid var(--hair); padding: 12px 0; font-size: 13.5px; }
  .br-tx:first-of-type { border-top: 0; }
  .br-tx .h { display: flex; justify-content: space-between; gap: 10px; }
  .br-steps { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .br-steps span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(10, 13, 18, .05); color: var(--ink3); }
  .br-steps span.on { background: rgba(21, 105, 255, .1); color: var(--key); }
  .br-steps span.ok { background: rgba(18, 176, 122, .12); color: #0b8a5f; }
  .br-addrs .sl-kv b { font-family: var(--mono); font-size: 12px; word-break: break-all; text-align: right; }
  .br-off { text-align: center; padding: 34px 20px; }
  .br-off h3 { font-size: 20px; font-weight: 400; margin: 10px 0 8px; }
  .br-off p { color: var(--ink2); max-width: 460px; margin: 0 auto; line-height: 1.7; }
  .br-foot { margin-top: 40px; font-size: 12.5px; color: var(--ink3); line-height: 1.7; max-width: 760px; }
  .br-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  @media (max-width: 860px) { .br-grid { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 420px) { .br-route { grid-template-columns: minmax(0, 1fr); } .br-flip { margin: 0 auto; transform: rotate(90deg); } .br-flip:hover { transform: rotate(270deg); } }
</style>
</head>
<body class="lt">
<main class="br">
  <div class="br-top">
    <a class="sl-brand" href="./" aria-label="Sectora Launch"><span class="sl-mark"><i></i></span><span class="sl-word">SECTORA <em>BRIDGE</em></span></a>
    <div class="br-langs" id="brLangs"></div>
  </div>
  <div class="br-head">
    <span class="sl-eyebrow"><i class="rule"></i><span id="brEyebrow"></span></span>
    <h1 id="brTitle"></h1>
    <p id="brLead"></p>
  </div>
  <div class="br-grid">
    <div class="sl-panel br-card" id="brCard"></div>
    <div class="br-side">
      <div class="sl-panel" id="brHistory" hidden></div>
      <div class="sl-panel"><h3 id="brHowT"></h3><ol class="br-how" id="brHow"></ol></div>
      <div class="sl-panel br-addrs" id="brAddrs"></div>
    </div>
  </div>
  <p class="br-foot" id="brFoot"></p>
</main>
<script src="vendor/ethers-6.13.4.umd.min.js"></script>
<script src="sb-abi.js?v=20261120a"></script>

</body>
</html>
